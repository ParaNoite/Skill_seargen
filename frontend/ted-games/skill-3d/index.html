<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>极光航道 | 3D 跑酷</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="game-shell"><header><div><p class="kicker">SKILL-GUIDED RUNNER</p><h1>极光航道 <span>3D</span></h1></div><div class="scoreboard"><b id="score">0</b><small>距离</small></div></header><section id="game-stage" class="game-stage" aria-label="Three.js 3D 跑酷场景"><div id="gameOver" class="overlay"><p id="result-label">准备进入航道</p><h2 id="result-title">抵达天际门</h2><button id="restart-btn" type="button">开始游戏</button></div><div class="touch-controls" aria-label="触控方向"><button id="left-zone" type="button" aria-label="向左移动">←</button><button id="right-zone" type="button" aria-label="向右移动">→</button></div></section><footer><span>方向键 / A D 控制跑道</span><span>移动端点击两侧方向键</span><span>避开障碍，冲过 1,000 米</span></footer></main><script type="module" src="game.js"></script></body>
</html>
