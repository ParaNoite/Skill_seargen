[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-skill-gather"
version = "0.1.0"
description = "Local CLI prototype for distilling auditable skills from video evidence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skill-gather = "skill_gather.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
