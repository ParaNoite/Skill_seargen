[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-skill-gather"
version = "1.0.0"
description = "Local CLI prototype for auditable multi-source topic research and skill distillation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["faster-whisper>=1.1,<2"]

[project.scripts]
skill-gather = "skill_gather.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"skill_gather.web_assets" = ["*.html", "*.css", "*.js"]
