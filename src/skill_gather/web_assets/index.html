<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>skill_seargen</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">SS</span>
      <span>skill_seargen</span>
    </div>
    <div class="top-actions">
      <span class="local-status"><i></i> 本地运行</span>
      <button id="check-button" class="button secondary" type="button">运行自检</button>
    </div>
  </header>

  <div id="react-nav"></div>

  <main class="shell">
    <section id="operations-view" class="view-panel" aria-labelledby="operations-title">
      <div class="section-heading"><div><p class="eyebrow">运营总览</p><h1 id="operations-title">任务队列与运行指标</h1></div><button id="metrics-refresh" class="button secondary" type="button">刷新指标</button></div>
      <div id="metrics-grid" class="detail-grid"><div class="metric"><div class="metric-label">正在加载</div><div class="metric-value">-</div></div></div>
      <div id="operations-list" class="runs-list" aria-live="polite"></div>
    </section>
    <section id="results-view" class="view-panel" hidden aria-labelledby="results-title">
      <div class="section-heading"><div><p class="eyebrow">结果浏览器</p><h1 id="results-title">知识包与 Skill</h1></div><div class="result-filters"><select id="results-type" aria-label="结果类型"><option value="all">全部类型</option><option value="video">视频</option><option value="topic">主题</option><option value="skill">Skill</option></select><select id="results-status" aria-label="结果状态"><option value="all">全部状态</option><option value="passed">通过</option><option value="needs_review">待复核</option><option value="failed">失败</option></select><input id="results-score" type="number" min="0" max="100" value="0" aria-label="最低评分" placeholder="最低评分"><input id="results-risk" aria-label="风险标记" placeholder="风险标记"><input id="results-source" aria-label="来源" placeholder="来源"><button id="results-compare" class="button secondary" type="button">比较所选</button><button id="results-export" class="button secondary" type="button">导出所选</button></div></div>
      <div id="results-list" class="runs-list"><div class="loading">选择结果页签后加载。</div></div>
      <div id="results-detail" class="result-detail" aria-live="polite"></div>
    </section>
    <section class="topic-panel research-view" hidden aria-labelledby="topic-title">
      <div class="topic-heading">
        <div>
          <p class="eyebrow">主题搜索</p>
          <h1 id="topic-title">先找来源，再确认处理</h1>
        </div>
        <form id="topic-form" class="topic-form">
          <input id="topic-input" name="topic" type="text" placeholder="例如：Godot 导航" required>
          <select id="topic-mode" name="mode" aria-label="主题模式">
            <option value="normal">普通模式</option>
            <option value="technical">技术模式</option>
          </select>
          <select id="topic-execution-mode" name="execution_mode" aria-label="执行模式"><option value="manual">手动确认</option><option value="auto">自动执行</option></select>
          <label class="check-label"><input id="topic-fake" name="fake" type="checkbox"> 离线 fake</label>
          <button class="button primary" type="submit">创建主题</button>
        </form>
      </div>
      <p id="topic-message" class="form-message" role="status"></p>
      <div class="topic-workspace">
        <aside id="topics-list" class="topics-list" aria-live="polite"><div class="loading compact">还没有主题任务。</div></aside>
        <section id="topic-detail" class="topic-detail" aria-live="polite"><div class="muted">创建主题后，这里会显示候选来源。</div></section>
      </div>
    </section>

    <section class="submit-panel research-view" hidden aria-labelledby="submit-title">
      <div>
        <p class="eyebrow">新建采集任务</p>
        <h1 id="submit-title">从视频提炼可复核 Skill</h1>
      </div>
      <form id="video-form">
        <div class="form-fields">
          <div>
            <label for="api-key">NewAPI API Key</label>
            <div class="input-row">
              <input id="api-key" name="api_key" type="password" placeholder="sk-..." autocomplete="off">
              <button id="models-button" class="button secondary" type="button">查询模型</button>
            </div>
            <div id="models-panel" class="models-panel" hidden></div>
          </div>
          <div>
            <label for="judge-difficulty">Judge 难度</label>
            <select id="judge-difficulty" name="judge_difficulty">
              <option value="standard" selected>标准</option>
              <option value="lenient">宽松</option>
              <option value="strict">严格</option>
              <option value="off">关闭 Judge</option>
            </select>
          </div>
          <div><label for="video-execution-mode">执行模式</label><select id="video-execution-mode" name="execution_mode"><option value="manual">手动</option><option value="auto">自动</option></select></div>
          <div>
            <label for="video-url">B 站公开视频 URL</label>
            <div class="input-row">
              <input id="video-url" name="url" type="url" placeholder="https://www.bilibili.com/video/BV..." required autocomplete="url">
              <button id="submit-button" class="button primary" type="submit">开始处理</button>
            </div>
          </div>
        </div>
        <p id="form-message" class="form-message" role="status"></p>
      </form>
    </section>

    <section class="workspace research-view" hidden>
      <aside class="runs-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Runs</p>
            <h2>处理记录</h2>
          </div>
          <button id="refresh-button" class="icon-button" type="button" aria-label="刷新处理记录" title="刷新">↻</button>
        </div>
        <div id="runs-list" class="runs-list" aria-live="polite"></div>
      </aside>

      <section id="detail-panel" class="detail-panel" aria-live="polite">
        <div class="empty-state">
          <span class="empty-icon">◎</span>
          <h2>选择一条处理记录</h2>
          <p>状态、评分与证据摘要会显示在这里。</p>
        </div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/react-nav.js" type="module"></script>
  <script src="/app.js" defer></script>
</body>
</html>
